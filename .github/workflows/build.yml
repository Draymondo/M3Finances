name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 19
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 19

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew --no-configuration-cache assembleDebug --console=plain > /tmp/build.log 2>&1 || true
          if ! grep -q "BUILD SUCCESSFUL" /tmp/build.log; then
            grep -E "^e: |went wrong|FAILED$" /tmp/build.log | head -120 | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do echo "::error::${line:0:1000}"; done
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  unit-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 19
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 19

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --console=plain > /tmp/test.log 2>&1 || true
          if ! grep -q "BUILD SUCCESSFUL" /tmp/test.log; then
            grep -E "^e: |went wrong|FAILED$|AssertionError|expected" /tmp/test.log | head -120 | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do echo "::error::${line:0:1000}"; done
            exit 1
          fi
