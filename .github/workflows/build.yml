name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 19
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 19

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set +e
          ./gradlew --no-configuration-cache assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-debug-apk.log"
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            grep -E "^e: " "$RUNNER_TEMP/gradle-debug-apk.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E "FAILED|Exception|error:|What went wrong|Execution failed|Could not|cannot find" "$RUNNER_TEMP/gradle-debug-apk.log" | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$GRADLE_EXIT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  unit-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 19
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 19

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          set +e
          ./gradlew testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle-unit-test.log"
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            grep -E "^e: " "$RUNNER_TEMP/gradle-unit-test.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E "FAILED|Exception|error:|What went wrong|Execution failed|Could not|cannot find|> There were failing tests| failures" "$RUNNER_TEMP/gradle-unit-test.log" | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$GRADLE_EXIT"
          fi
