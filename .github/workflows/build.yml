name: Build

on:
  push:
    branches:
      - main
  # Permet de compiler n'importe quelle branche à la demande (utile pour
  # valider une PR avant merge, et pour les branches d'agent).
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 19
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 19

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-configuration-cache assembleDebug 2>&1 | tee gradle-build.log

      # Les logs d'Actions ne sont pas toujours accessibles depuis un sandbox :
      # on republie les erreurs Kotlin/Gradle en annotations, lisibles via
      # l'API des check-runs.
      - name: Publish build errors as annotations
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            grep -E "^e: |^w: .*error|error:|Execution failed for task|What went wrong|Caused by:" gradle-build.log \
              | head -n 40 \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
          else
            echo "::error::gradle-build.log is missing"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  unit-test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 19
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 19

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee gradle-test.log

      - name: Publish test errors as annotations
        if: failure()
        run: |
          if [ -f gradle-test.log ]; then
            grep -E "^e: |error:|FAILED|Execution failed for task|What went wrong|Caused by:" gradle-test.log \
              | head -n 40 \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
          else
            echo "::error::gradle-test.log is missing"
          fi
